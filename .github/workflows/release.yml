name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm install

      - name: Build packages (order matters)
        run: |
          npm run build -w packages/testing
          npm run build -w packages/tools

      - name: Test packages
        run: |
          npm run test -w packages/testing
          npm run test -w packages/tools

      # Determine which packages to publish based on tag prefix
      - name: Determine release scope
        id: scope
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" == tools-v* ]]; then
            echo "publish_tools=true" >> "$GITHUB_OUTPUT"
            echo "publish_testing=false" >> "$GITHUB_OUTPUT"
            echo "publish_scala=false" >> "$GITHUB_OUTPUT"
            echo "expected_version=${TAG#tools-v}" >> "$GITHUB_OUTPUT"
            echo "Scoped release: tools only"
          elif [[ "$TAG" == testing-v* ]]; then
            echo "publish_tools=false" >> "$GITHUB_OUTPUT"
            echo "publish_testing=true" >> "$GITHUB_OUTPUT"
            echo "publish_scala=false" >> "$GITHUB_OUTPUT"
            echo "expected_version=${TAG#testing-v}" >> "$GITHUB_OUTPUT"
            echo "Scoped release: testing only"
          else
            echo "publish_tools=true" >> "$GITHUB_OUTPUT"
            echo "publish_testing=true" >> "$GITHUB_OUTPUT"
            echo "publish_scala=true" >> "$GITHUB_OUTPUT"
            echo "expected_version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "Global release: all packages"
          fi

      # Verify package versions match the release tag (only for packages being published)
      - name: Verify versions match tag
        run: |
          EXPECTED="${{ steps.scope.outputs.expected_version }}"
          FAILED=false

          if [ "${{ steps.scope.outputs.publish_tools }}" = "true" ]; then
            TOOLS_VERSION=$(node -p "require('./packages/tools/package.json').version")
            if [ "$TOOLS_VERSION" != "$EXPECTED" ]; then
              echo "Version mismatch in packages/tools: expected $EXPECTED, got $TOOLS_VERSION"
              FAILED=true
            fi
          fi

          if [ "${{ steps.scope.outputs.publish_testing }}" = "true" ]; then
            TESTING_VERSION=$(node -p "require('./packages/testing/package.json').version")
            if [ "$TESTING_VERSION" != "$EXPECTED" ]; then
              echo "Version mismatch in packages/testing: expected $EXPECTED, got $TESTING_VERSION"
              FAILED=true
            fi
          fi

          if [ "$FAILED" = "true" ]; then
            exit 1
          fi
          echo "Package versions match tag"

      - name: Publish @organon-methodology/testing
        if: steps.scope.outputs.publish_testing == 'true'
        run: npm publish -w packages/testing --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @organon-methodology/tools
        if: steps.scope.outputs.publish_tools == 'true'
        run: npm publish -w packages/tools --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-scala:
    runs-on: ubuntu-latest
    needs: [publish]
    if: startsWith(github.event.release.tag_name, 'v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: sbt/setup-sbt@v1

      - name: Publish to Maven Central
        working-directory: packages/testing-scala
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
